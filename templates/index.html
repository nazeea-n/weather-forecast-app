<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather App</title>
<style>
  :root { --g1: #3a6ee0; --g2: #4fc3f7; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: #fff;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--g1), var(--g2)) fixed;
  }
  body[data-theme="clear"]  { --g1: #2b88f0; --g2: #7ad0ff; }
  body[data-theme="clouds"] { --g1: #5b7083; --g2: #a3b4c2; }
  body[data-theme="rain"]   { --g1: #2c3e50; --g2: #4b79a1; }
  body[data-theme="storm"]  { --g1: #1f1c2c; --g2: #5c4b8a; }
  body[data-theme="snow"]   { --g1: #6f9bc0; --g2: #b9d3ea; }
  body[data-theme="fog"]    { --g1: #6b7b8a; --g2: #b0bcc6; }

  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: .5px; }
  .sub { opacity: .85; margin-bottom: 22px; }

  .glass {
    background: rgba(255, 255, 255, .16);
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 22px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .18);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 22px;
    margin-bottom: 18px;
  }

  .search { display: flex; gap: 10px; }
  .search input {
    flex: 1; min-width: 0; padding: 14px 20px; font-size: 17px;
    border: 0; border-radius: 30px; outline: none;
    background: rgba(255, 255, 255, .92); color: #1b2a41;
  }
  .search button {
    padding: 0 26px; font-size: 16px; font-weight: 600; cursor: pointer;
    border: 0; border-radius: 30px; background: #fff; color: #1b4fd8;
    transition: transform .15s;
  }
  .search button:hover { transform: scale(1.05); }
  .msg { color: #ffe3e3; background: rgba(201, 42, 42, .55); padding: 10px 16px; border-radius: 12px; margin-top: 12px; display: none; }

  .hero { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .city { font-size: 30px; font-weight: 700; }
  .date { opacity: .85; margin-top: 2px; }
  .temp { font-size: 84px; font-weight: 300; line-height: 1; margin-top: 14px; }
  .desc { font-size: 20px; opacity: .95; margin-top: 6px; }
  .icon { font-size: 110px; line-height: 1; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
  .stat { background: rgba(255, 255, 255, .14); border-radius: 16px; padding: 14px; text-align: center; }
  .stat .v { font-size: 22px; font-weight: 600; }
  .stat .l { font-size: 13px; opacity: .85; margin-top: 2px; }

  .title { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
  .forecast { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 12px; }
  .day { background: rgba(255, 255, 255, .14); border-radius: 18px; padding: 16px 10px; text-align: center; transition: transform .2s; }
  .day:hover { transform: translateY(-4px); }
  .day .n { font-weight: 600; }
  .day .ic { font-size: 40px; margin: 8px 0; }
  .day .t { font-size: 18px; font-weight: 600; }
  .day .t span { opacity: .7; font-weight: 400; }
  .day .s { font-size: 12px; opacity: .85; margin-top: 6px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .15);
    color: #fff; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-size: 14px;
  }
  .chip:hover { background: rgba(255, 255, 255, .3); }
  .note { opacity: .85; font-size: 14px; }

  .center { text-align: center; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 10px; border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, .3); border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade { animation: fade .5s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  @media (max-width: 560px) {
    .temp { font-size: 64px; }
    .icon { font-size: 80px; }
    .city { font-size: 24px; }
    .stats { gap: 8px; }
    .stat .v { font-size: 18px; }
  }
</style>
</head>
<body data-theme="default">
<div class="wrap">
  <h1>🌤️ Weather App</h1>
  <div class="sub">Search any place for live weather and a 5-day forecast</div>

  <div class="glass">
    <div class="search">
      <input id="city" placeholder="Search a place, e.g. Hosur" autocomplete="off">
      <button id="go">Search</button>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <div id="result">
    <div class="glass center">
      <div style="font-size:60px">🌍</div>
      <div class="title" style="margin-top:8px">Search any place to see its weather</div>
      <div class="chips" style="justify-content:center">
        <button class="chip" data-city="Hosur">Hosur</button>
        <button class="chip" data-city="Chennai">Chennai</button>
        <button class="chip" data-city="Bengaluru">Bengaluru</button>
        <button class="chip" data-city="London">London</button>
        <button class="chip" data-city="Tokyo">Tokyo</button>
      </div>
    </div>
  </div>

  <div class="glass">
    <div class="title">🕘 Recent searches</div>
    <div id="history" class="chips"><span class="note">Loading...</span></div>
  </div>
</div>

<script>
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function themeFor(desc) {
  const d = desc.toLowerCase();
  if (d.includes('thunder')) return 'storm';
  if (d.includes('snow')) return 'snow';
  if (d.includes('rain') || d.includes('drizzle') || d.includes('shower')) return 'rain';
  if (d.includes('fog')) return 'fog';
  if (d.includes('cloud') || d.includes('overcast')) return 'clouds';
  if (d.includes('clear')) return 'clear';
  return 'default';
}

function dayName(dateStr, i) {
  if (i === 0) return 'Today';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
}

function showMsg(text) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.style.display = text ? 'block' : 'none';
}

async function search(name) {
  const input = document.getElementById('city');
  const city = (name || input.value).trim();
  showMsg('');
  if (!city) { showMsg('Please type a city name'); return; }
  input.value = city;

  const result = document.getElementById('result');
  result.innerHTML = '<div class="glass center"><div class="spinner"></div>Fetching weather...</div>';

  try {
    const r = await fetch('/api/weather?city=' + encodeURIComponent(city));
    const data = await r.json();
    if (!r.ok) {
      result.innerHTML = '';
      showMsg(data.error || 'Something went wrong');
      return;
    }
    render(data);
    loadHistory();
  } catch (e) {
    result.innerHTML = '';
    showMsg('Could not reach the server. Is the app still running?');
  }
}

function render(data) {
  const c = data.current;
  document.body.dataset.theme = themeFor(c.description);
  const today = new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' });

  let html = `<div class="glass fade">
    <div class="hero">
      <div>
        <div class="city">${esc(data.city)}, ${esc(data.country)}</div>
        <div class="date">${today}</div>
        <div class="temp">${Math.round(c.temperature)}°C</div>
        <div class="desc">${esc(c.description)}</div>
      </div>
      <div class="icon">${c.icon}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="v">${Math.round(c.feels_like)}°C</div><div class="l">Feels like</div></div>
      <div class="stat"><div class="v">${c.humidity}%</div><div class="l">Humidity</div></div>
      <div class="stat"><div class="v">${c.wind} km/h</div><div class="l">Wind</div></div>
    </div>
  </div>
  <div class="glass fade">
    <div class="title">📅 5-day forecast</div>
    <div class="forecast">`;
  data.daily.forEach((d, i) => {
    html += `<div class="day">
      <div class="n">${esc(dayName(d.date, i))}</div>
      <div class="ic">${d.icon}</div>
      <div class="t">${Math.round(d.max)}° <span>${Math.round(d.min)}°</span></div>
      <div class="s">${esc(d.description)}<br>🌧 ${d.rain} mm</div>
    </div>`;
  });
  html += '</div></div>';
  document.getElementById('result').innerHTML = html;
}

async function loadHistory() {
  const box = document.getElementById('history');
  try {
    const data = await (await fetch('/api/history')).json();
    if (!data.available) {
      box.innerHTML = '<span class="note">MySQL is not connected, so history is not saved. The weather still works.</span>';
      return;
    }
    if (!data.history.length) { box.innerHTML = '<span class="note">No searches yet.</span>'; return; }
    box.innerHTML = data.history.map(h =>
      `<button class="chip" data-city="${esc(h.city)}">${esc(h.city)} · ${Math.round(h.temperature)}°C</button>`).join('');
  } catch (e) {
    box.innerHTML = '<span class="note">Could not load history.</span>';
  }
}

document.getElementById('go').addEventListener('click', () => search());
document.getElementById('city').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip && chip.dataset.city) search(chip.dataset.city);
});
loadHistory();
</script>
</body>
</html>
